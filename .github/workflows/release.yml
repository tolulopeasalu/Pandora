name: Release Bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build signed release bundle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew bundleRelease
          -PRELEASE_STORE_FILE=release.keystore
          -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
          -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"
          -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: android-starter-release
          path: app/build/outputs/bundle/release/*.aab
